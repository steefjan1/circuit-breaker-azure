<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2733"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b26a00"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fa"/><text x="50" y="58" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2733" text-anchor="start">Three states in the process, two at the gateway</text><text x="50" y="88" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b7b" text-anchor="start">The demo values. A real threshold is a ratio over a window, with a minimum number of calls.</text><rect x="50" y="125" width="1500" height="330" rx="12" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/><svg x="76" y="146" width="40" height="40" viewBox="0 0 18 18"><defs><linearGradient id="i1_b403aca7-f387-4434-96b4-ae157edc835f" x1="-175.993" y1="-343.723" x2="-175.993" y2="-359.232" gradientTransform="translate(212.573 370.548) scale(1.156 1.029)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fea11b" /><stop offset="0.284" stop-color="#fea51a" /><stop offset="0.547" stop-color="#feb018" /><stop offset="0.8" stop-color="#ffc314" /><stop offset="1" stop-color="#ffd70f" /></linearGradient></defs><g><path d="M2.37,7.475H3.2a.267.267,0,0,1,.267.267v6.148a.533.533,0,0,1-.533.533H2.1a0,0,0,0,1,0,0V7.741a.267.267,0,0,1,.267-.267Z" transform="translate(12.507 16.705) rotate(134.919)" fill="#50e6ff" /><path d="M2.325,3.6h.833a.267.267,0,0,1,.267.267v6.583a0,0,0,0,1,0,0H2.591a.533.533,0,0,1-.533-.533V3.865A.267.267,0,0,1,2.325,3.6Z" transform="translate(5.759 0.114) rotate(44.919)" fill="#1490df" /></g><g><path d="M14.53,7.475h.833a.533.533,0,0,1,.533.533v6.148a.267.267,0,0,1-.267.267H14.8a.267.267,0,0,1-.267-.267V7.475a0,0,0,0,1,0,0Z" transform="translate(12.223 -7.555) rotate(45.081)" fill="#50e6ff" /><path d="M15.108,3.6h.833a0,0,0,0,1,0,0v6.583a.267.267,0,0,1-.267.267h-.833a.267.267,0,0,1-.267-.267V4.131a.533.533,0,0,1,.533-.533Z" transform="translate(31.022 1.222) rotate(135.081)" fill="#1490df" /></g><path d="M8.459,9.9H4.87a.193.193,0,0,1-.2-.181.166.166,0,0,1,.018-.075L8.991,1.13a.206.206,0,0,1,.186-.106h4.245a.193.193,0,0,1,.2.181.165.165,0,0,1-.035.1L8.534,7.966h4.928a.193.193,0,0,1,.2.181.176.176,0,0,1-.052.122L5.421,16.788c-.077.046-.624.5-.356-.189h0Z" fill="url(#i1_b403aca7-f387-4434-96b4-ae157edc835f)" /></svg><text x="128" y="166" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2733" text-anchor="start">In the process: Polly circuit breaker</text><text x="128" y="187" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">One breaker per Function App instance. Instances do not share state.</text><circle cx="400" cy="325" r="92" fill="#e9f6ec" stroke="#1a7f37" stroke-width="3"/><text x="400" y="321" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2733" text-anchor="middle">CLOSED</text><text x="400" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle">calls flow</text><circle cx="800" cy="325" r="92" fill="#fdecec" stroke="#c62828" stroke-width="3"/><text x="800" y="321" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2733" text-anchor="middle">OPEN</text><text x="800" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle">fail in microseconds</text><circle cx="1200" cy="325" r="92" fill="#fff4dd" stroke="#b26a00" stroke-width="3"/><text x="1200" y="321" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2733" text-anchor="middle">HALF-OPEN</text><text x="1200" y="347" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle">one probe call</text><path d="M 492 300 L 708 300" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="600" y="268" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">50% or more of at least 10 calls</text><text x="600" y="286" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">failed within 10 s</text><path d="M 892 300 L 1108 300" fill="none" stroke="#b26a00" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><text x="1000" y="286" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#b26a00" text-anchor="middle">after 15 s</text><path d="M 1108 350 L 892 350" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><text x="1000" y="376" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">probe fails: open again</text><path d="M 1200 417 L 1200 438 L 400 438 L 400 419" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/><rect x="700" y="425" width="200" height="26" rx="13" fill="#e9f6ec" stroke="#1a7f37" stroke-width="1.5"/><text x="800" y="443" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">probe succeeds</text><text x="1330" y="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b2733" text-anchor="start">Counts as failure:</text><text x="1330" y="320" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">5xx, 408, 429,</text><text x="1330" y="338" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">timeouts, connection errors</text><text x="1330" y="364" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">Does not count: 400, 404</text><rect x="50" y="480" width="1500" height="280" rx="12" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/><svg x="76" y="500" width="40" height="40" viewBox="0 0 18 18"><defs><linearGradient id="i2_bf8a9583-aae9-48ff-87d8-fb8f44e7d6bd" x1="9" y1="16.82" x2="9" y2="1.18" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#198ab3" /><stop offset="0.09" stop-color="#1f9dc4" /><stop offset="0.24" stop-color="#28b5d9" /><stop offset="0.4" stop-color="#2dc6e9" /><stop offset="0.57" stop-color="#31d1f2" /><stop offset="0.78" stop-color="#32d4f5" /></linearGradient><linearGradient id="i2_f9b1bb8c-728e-4abf-bce5-6c11ac170c5b" x1="8.36" y1="11.35" x2="8.36" y2="14.46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c69aeb" /><stop offset="1" stop-color="#6f4bb2" /></linearGradient></defs><path d="M14.18,5.89A4.85,4.85,0,0,0,9.23,1.18,5,5,0,0,0,4.48,4.47,4.61,4.61,0,0,0,.5,9,4.67,4.67,0,0,0,5.29,13.5a3,3,0,0,0,.42,0h1.2a1.47,1.47,0,0,1-.11-.56v0A1.51,1.51,0,0,1,7,12.21H5.6l-.31,0A3.41,3.41,0,0,1,1.77,9,3.33,3.33,0,0,1,4.68,5.73l.76-.12.25-.73A3.73,3.73,0,0,1,9.23,2.45,3.6,3.6,0,0,1,12.91,5.9V7L14,7.15a2.59,2.59,0,0,1,2.26,2.49,2.63,2.63,0,0,1-2.62,2.54h-.15l-.08,0h-1A3.92,3.92,0,0,0,8.54,9a.64.64,0,1,0,0,1.27,2.65,2.65,0,0,1,0,5.29.64.64,0,1,0,0,1.27,3.92,3.92,0,0,0,3.87-3.34h1.05a.64.64,0,0,0,.2,0A3.91,3.91,0,0,0,17.5,9.64,3.86,3.86,0,0,0,14.18,5.89Z" fill="url(#i2_bf8a9583-aae9-48ff-87d8-fb8f44e7d6bd)" /><rect x="6.8" y="11.35" width="3.12" height="3.12" rx="1.54" fill="url(#i2_f9b1bb8c-728e-4abf-bce5-6c11ac170c5b)" /></svg><text x="128" y="520" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b2733" text-anchor="start">At the gateway: API Management backend circuit breaker</text><text x="128" y="541" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">One rule per backend. Gateway instances do not synchronize, so tripping is approximate.</text><circle cx="400" cy="655" r="92" fill="#e9f6ec" stroke="#1a7f37" stroke-width="3"/><text x="400" y="651" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2733" text-anchor="middle">CLOSED</text><text x="400" y="677" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle">calls flow</text><circle cx="800" cy="655" r="92" fill="#fdecec" stroke="#c62828" stroke-width="3"/><text x="800" y="651" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2733" text-anchor="middle">TRIPPED</text><text x="800" y="677" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle">503 from the gateway</text><path d="M 492 630 L 708 630" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="600" y="616" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#c62828" text-anchor="middle">5 answers in 500-599 within 10 s</text><path d="M 708 680 L 492 680" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/><text x="600" y="706" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a7f37" text-anchor="middle">after 15 s: all traffic resumes</text><text x="1000" y="630" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#1b2733" text-anchor="start">No half-open state.</text><text x="1000" y="654" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">After the trip duration the full load returns at once.</text><text x="1000" y="674" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">If the provider is still down, five more calls fail</text><text x="1000" y="694" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start">before the circuit trips again.</text></svg>